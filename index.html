<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Form Pemesanan Tas Travel</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:'Segoe UI', Arial, sans-serif;
background: linear-gradient(135deg,#4facfe,#00f2fe);
margin:0;
padding:0;
}

/* WRAPPER */
.container{
max-width:500px;
margin:auto;
padding:20px 15px 40px;
}

/* CARD */
.box{
background:white;
padding:20px;
border-radius:20px;
box-shadow:0 8px 25px rgba(0,0,0,0.15);
width:100%;
box-sizing:border-box;
}

/* HEADER */
.title{
font-size:20px;
font-weight:700;
text-align:center;
margin-bottom:5px;
}

.subtitle{
text-align:center;
font-size:13px;
color:#666;
margin-bottom:15px;
}

/* SECTION */
.section{
margin-top:20px;
}

.section-title{
font-weight:600;
margin-bottom:10px;
font-size:14px;
}

/* PRODUK */
.product{
display:flex;
justify-content:space-between;
align-items:center;
padding:14px;
border-radius:12px;
margin-bottom:10px;
background:#f6f7f9;
}

.product input{
width:60px;
padding:8px;
border-radius:8px;
border:1px solid #ddd;
text-align:center;
}

/* INPUT */
input, select, textarea{
width:100%;
padding:13px;
margin-top:10px;
border:1px solid #ddd;
border-radius:12px;
font-size:14px;
box-sizing:border-box;
background:#fafafa;
}

textarea{
min-height:90px;
resize:none;
}

/* BUTTON */
button{
margin-top:20px;
width:100%;
padding:15px;
background: linear-gradient(135deg,#25D366,#128C7E);
border:none;
color:white;
font-weight:600;
border-radius:14px;
font-size:16px;
}

</style>
</head>

<body>

<div class="container">
<div class="box">

<div class="title">Form Pemesanan Tas Travel</div>
<div class="subtitle">🔥 Promo Hari Ini - Gratis Ongkir!</div>

<form id="formPesanan">

<div class="section">
<div class="section-title">Produk yang dipesan</div>

<div class="product">
<span>Tas Travel Pink</span>
<input type="number" id="pink" value="0" min="0">
</div>

<div class="product">
<span>Tas Travel Hitam</span>
<input type="number" id="hitam" value="0" min="0">
</div>

</div>

<div class="section">
<div class="section-title">Lengkapi alamat pengiriman</div>

<select id="pembayaran">
<option value="">Metode Pembayaran</option>
<option value="Cash on Delivery">Cash on Delivery (COD)</option>
<option value="Transfer Bank">Transfer Bank</option>
</select>

<input type="text" id="nama" placeholder="Nama Penerima">
<input type="text" id="jalan" placeholder="Nama Jalan (contoh: JL.Anggrek)">
<input type="number" id="rt" placeholder="RT (angka)">
<input type="number" id="rumah" placeholder="No Rumah (angka)">
<input type="text" id="kelurahan" placeholder="Kelurahan / Desa">
<input type="text" id="kecamatan" placeholder="Kecamatan">
<input type="text" id="kota" placeholder="Kota / Kabupaten">
<input type="text" id="provinsi" placeholder="Provinsi">
<textarea id="catatan" placeholder="Catatan Rumah / Patokan"></textarea>

</div>

<button type="submit">Kirim Pesanan</button>

</form>

</div>
</div>

<script>

document.getElementById("formPesanan").addEventListener("submit", function(e){

e.preventDefault();

var pink=parseInt(document.getElementById("pink").value) || 0;
var hitam=parseInt(document.getElementById("hitam").value) || 0;

if(pink==0 && hitam==0){
alert("Silakan pilih jumlah tas yang ingin dipesan 😊");
return;
}

var pembayaran=document.getElementById("pembayaran").value;

if(pembayaran==""){
alert("Silakan pilih metode pembayaran dulu 😊");
return;
}

var nama=document.getElementById("nama").value;
var jalan=document.getElementById("jalan").value;
var rt=document.getElementById("rt").value;
var rumah=document.getElementById("rumah").value;
var kel=document.getElementById("kelurahan").value;
var kec=document.getElementById("kecamatan").value;
var kota=document.getElementById("kota").value;
var prov=document.getElementById("provinsi").value;
var catatan=document.getElementById("catatan").value;

if(nama=="" || jalan=="" || rt=="" || rumah=="" || kel=="" || kec=="" || kota=="" || prov=="" || catatan==""){
alert("Mohon lengkapi semua data alamat 😊");
return;
}

var harga=91000;

var alamat=jalan+" RT."+rt+" No."+rumah;

var detail="";

if(pink>0){
detail+="* Tas Travel Pink × "+pink+"%0A";
}

if(hitam>0){
detail+="* Tas Travel Hitam × "+hitam+"%0A";
}

var totalBarang=pink+hitam;
var totalHarga=totalBarang*harga;
var formatHarga=totalHarga.toLocaleString("id-ID");

var pesan=
"Halo kak, saya ingin melakukan pemesanan.%0A%0A"+
"*Nama:* "+nama+"%0A%0A"+
"*Alamat:*%0A"+
alamat+"%0A("+catatan+")%0A"+
"Kel: "+kel+"%0A"+
"Kec: "+kec+"%0A"+
"Kota: "+kota+"%0A"+
"Prov: "+prov+"%0A%0A"+
"*Pesanan:*%0A"+detail+"%0A"+
"*Pembayaran:* "+pembayaran+"%0A"+
"Ongkir: Rp0%0A"+
"*Total:* Rp"+formatHarga+"%0A%0A"+
"Mohon diproses 🙏";

var url="https://api.whatsapp.com/send?phone=15558770694&text="+pesan;

window.location.href=url;

});

</script>

</body>
</html>
