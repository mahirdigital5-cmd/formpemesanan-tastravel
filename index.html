<style>

body{
font-family:'Segoe UI', Arial, sans-serif;
background: linear-gradient(135deg,#4facfe,#00f2fe);
display:flex;
justify-content:center;
align-items:flex-start;
min-height:100vh;
margin:0;
padding:30px 15px;
}

.box{
background:white;
padding:25px;
border-radius:16px;
box-shadow:0 10px 30px rgba(0,0,0,0.2);
width:100%;
max-width:450px;
animation:fadeIn .5s ease;
}

@keyframes fadeIn{
from{opacity:0; transform:translateY(20px);}
to{opacity:1; transform:translateY(0);}
}

.title{
font-size:22px;
font-weight:700;
text-align:center;
margin-bottom:20px;
color:#222;
}

.section{
margin-top:20px;
}

.section-title{
font-weight:600;
margin-bottom:10px;
color:#444;
font-size:14px;
}

.product{
display:flex;
justify-content:space-between;
align-items:center;
padding:12px;
border-radius:10px;
margin-bottom:10px;
background:#f9f9f9;
transition:.2s;
}

.product:hover{
background:#f1f7ff;
}

.product span{
font-weight:500;
}

.product input{
width:65px;
padding:8px;
border-radius:8px;
border:1px solid #ddd;
text-align:center;
}

input, select, textarea{
width:100%;
padding:12px;
margin-top:10px;
border:1px solid #ddd;
border-radius:10px;
font-size:14px;
box-sizing:border-box;
transition:.2s;
}

input:focus, select:focus, textarea:focus{
outline:none;
border-color:#4facfe;
box-shadow:0 0 0 2px rgba(79,172,254,0.2);
}

textarea{
min-height:90px;
resize:none;
}

button{
margin-top:20px;
width:100%;
padding:14px;
background: linear-gradient(135deg,#25D366,#128C7E);
border:none;
color:white;
font-weight:600;
border-radius:12px;
cursor:pointer;
font-size:16px;
transition:.2s;
}

button:hover{
transform:translateY(-2px);
box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

button:active{
transform:scale(.98);
}

</style>
