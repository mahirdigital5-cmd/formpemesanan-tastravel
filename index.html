<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Form Pemesanan Tas Travel</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:'Segoe UI', Arial, sans-serif;
background: linear-gradient(135deg,#4facfe,#00f2fe);
margin:0;
}

/* WRAPPER */
.container{
max-width:500px;
margin:auto;
padding:20px 15px 100px;
}

/* CARD */
.box{
background:white;
padding:20px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,0.15);
}

/* HEADER */
.title{
font-size:20px;
font-weight:700;
text-align:center;
}

.subtitle{
text-align:center;
font-size:13px;
color:#666;
margin-bottom:15px;
}

/* PRODUK */
.product{
display:flex;
gap:12px;
align-items:center;
padding:12px;
border-radius:12px;
background:#f6f7f9;
margin-bottom:10px;
}

.product img{
width:60px;
height:60px;
border-radius:10px;
object-fit:cover;
}

.product-info{
flex:1;
}

.product-title{
font-size:14px;
font-weight:600;
}

.product-price{
font-size:13px;
color:#888;
}

.product input{
width:55px;
padding:8px;
border-radius:8px;
border:1px solid #ddd;
text-align:center;
}

/* INPUT */
input, select, textarea{
width:100%;
padding:13px;
margin-top:10px;
border:1px solid #ddd;
border-radius:12px;
font-size:14px;
box-sizing:border-box;
background:#fafafa;
}

/* SUMMARY */
.summary{
background:#f9fafc;
padding:15px;
border-radius:12px;
margin-top:20px;
font-size:14px;
}

.row{
display:flex;
justify-content:space-between;
margin-bottom:8px;
}

.total{
font-weight:700;
font-size:16px;
}

.strike{
text-decoration:line-through;
color:#999;
}

/* BUTTON STICKY */
.button-wrap{
position:fixed;
bottom:0;
left:0;
right:0;
background:white;
padding:10px;
box-shadow:0 -5px 15px rgba(0,0,0,0.1);
}

button{
width:100%;
padding:15px;
background: linear-gradient(135deg,#25D366,#128C7E);
border:none;
color:white;
font-weight:600;
border-radius:12px;
font-size:16px;
}

</style>
</head>

<body>

<div class="container">
<div class="box">

<div class="title">Form Pemesanan Tas Travel</div>
<div class="subtitle">🔥 Promo Hari Ini - Gratis Ongkir!</div>

<form id="formPesanan">

<!-- PRODUK -->
<div class="product">
<img src="https://via.placeholder.com/60/ff69b4/ffffff?text=Pink">
<div class="product-info">
<div class="product-title">Tas Travel Pink</div>
<div class="product-price">Rp91.000</div>
</div>
<input type="number" id="pink" value="0" min="0" onchange="hitung()">
</div>

<div class="product">
<img src="https://via.placeholder.com/60/000000/ffffff?text=Hitam">
<div class="product-info">
<div class="product-title">Tas Travel Hitam</div>
<div class="product-price">Rp91.000</div>
</div>
<input type="number" id="hitam" value="0" min="0" onchange="hitung()">
</div>

<!-- ALAMAT -->
<select id="pembayaran">
<option value="">Metode Pembayaran</option>
<option value="Cash on Delivery">Cash on Delivery (COD)</option>
<option value="Transfer Bank">Transfer Bank</option>
</select>

<input type="text" id="nama" placeholder="Nama Penerima">
<input type="text" id="jalan" placeholder="Nama Jalan">
<input type="number" id="rt" placeholder="RT">
<input type="number" id="rumah" placeholder="No Rumah">
<input type="text" id="kelurahan" placeholder="Kelurahan">
<input type="text" id="kecamatan" placeholder="Kecamatan">
<input type="text" id="kota" placeholder="Kota">
<input type="text" id="provinsi" placeholder="Provinsi">
<textarea id="catatan" placeholder="Catatan Rumah"></textarea>

<!-- SUMMARY -->
<div class="summary">
<div class="row">
<span>Subtotal</span>
<span id="subtotal">Rp0</span>
</div>

<div class="row">
<span>Ongkir</span>
<span><span class="strike">Rp25.000</span> Gratis</span>
</div>

<div class="row total">
<span>Total</span>
<span id="total">Rp0</span>
</div>
</div>

</form>

</div>
</div>

<!-- BUTTON -->
<div class="button-wrap">
<button onclick="kirim()">Kirim Pesanan</button>
</div>

<script>

var harga=91000;

function hitung(){
var pink=parseInt(document.getElementById("pink").value)||0;
var hitam=parseInt(document.getElementById("hitam").value)||0;

var totalBarang=pink+hitam;
var totalHarga=totalBarang*harga;

document.getElementById("subtotal").innerText="Rp"+totalHarga.toLocaleString("id-ID");
document.getElementById("total").innerText="Rp"+totalHarga.toLocaleString("id-ID");
}

function kirim(){

var pink=parseInt(document.getElementById("pink").value)||0;
var hitam=parseInt(document.getElementById("hitam").value)||0;

if(pink==0 && hitam==0){
alert("Pilih produk dulu 😊");
return;
}

var pembayaran=document.getElementById("pembayaran").value;
if(pembayaran==""){
alert("Pilih pembayaran 😊");
return;
}

var nama=document.getElementById("nama").value;
var jalan=document.getElementById("jalan").value;
var rt=document.getElementById("rt").value;
var rumah=document.getElementById("rumah").value;
var kel=document.getElementById("kelurahan").value;
var kec=document.getElementById("kecamatan").value;
var kota=document.getElementById("kota").value;
var prov=document.getElementById("provinsi").value;
var catatan=document.getElementById("catatan").value;

if(nama==""||jalan==""||rt==""||rumah==""||kel==""||kec==""||kota==""||prov==""||catatan==""){
alert("Lengkapi alamat 😊");
return;
}

var alamat=jalan+" RT."+rt+" No."+rumah;

var detail="";
if(pink>0){detail+="* Tas Pink × "+pink+"%0A";}
if(hitam>0){detail+="* Tas Hitam × "+hitam+"%0A";}

var total=(pink+hitam)*harga;

var pesan=
"Halo kak saya mau pesan%0A%0A"+
"*Nama:* "+nama+"%0A"+
"*Alamat:*%0A"+alamat+"%0A("+catatan+")%0A"+
kota+", "+prov+"%0A%0A"+
"*Pesanan:*%0A"+detail+"%0A"+
"*Pembayaran:* "+pembayaran+"%0A"+
"Ongkir: Gratis%0A"+
"*Total:* Rp"+total.toLocaleString("id-ID");

window.location.href="https://api.whatsapp.com/send?phone=15558770694&text="+pesan;
}

</script>

</body>
</html>
