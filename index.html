<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Form Pemesanan Tas Travel</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

body{
font-family:'Segoe UI', Arial, sans-serif;
background: linear-gradient(135deg,#4facfe,#00f2fe);
margin:0;
}

/* WRAPPER */
.container{
max-width:480px;
margin:auto;
padding:20px 12px 40px;
}

/* CARD */
.box{
background:white;
padding:20px 16px;
border-radius:18px;
box-shadow:0 10px 30px rgba(0,0,0,0.15);
}

/* HEADER */
.title{
font-size:20px;
font-weight:700;
text-align:center;
margin-bottom:4px;
}

.subtitle{
text-align:center;
font-size:13px;
color:#777;
margin-bottom:15px;
}

/* PRODUK */
.product{
display:flex;
gap:10px;
align-items:center;
padding:10px;
border-radius:12px;
background:#f5f6f8;
margin-bottom:10px;
}

.product img{
width:55px;
height:55px;
border-radius:10px;
object-fit:cover;
}

.product-info{
flex:1;
}

.product-title{
font-size:14px;
font-weight:600;
}

.product-price{
font-size:12px;
color:#888;
}

.product input{
width:50px;
padding:7px;
border-radius:8px;
border:1px solid #ddd;
text-align:center;
}

/* INPUT FIX */
input, select, textarea{
width:100%;
padding:12px;
margin-top:10px;
border:1px solid #ddd;
border-radius:10px;
font-size:14px;
background:#fafafa;
box-sizing:border-box;
}

/* SUMMARY */
.summary{
background:#f9fafc;
padding:14px;
border-radius:12px;
margin-top:18px;
font-size:14px;
}

.row{
display:flex;
justify-content:space-between;
margin-bottom:6px;
}

.total{
font-weight:700;
font-size:15px;
}

.green{
color:#25D366;
font-weight:600;
font-size:13px;
}

.strike{
text-decoration:line-through;
color:#999;
}

/* BUTTON */
button{
margin-top:18px;
width:100%;
padding:14px;
background: linear-gradient(135deg,#25D366,#128C7E);
border:none;
color:white;
font-weight:600;
border-radius:12px;
font-size:15px;
}

</style>
</head>

<body>

<div class="container">
<div class="box">

<div class="title">Form Pemesanan Tas Travel</div>
<div class="subtitle">🔥 Promo Hari Ini - Gratis Ongkir!</div>

<form id="formPesanan">

<div class="product">
<img src="https://via.placeholder.com/60/ff69b4/ffffff?text=Pink">
<div class="product-info">
<div class="product-title">Tas Travel Pink</div>
<div class="product-price">Rp50.000</div>
</div>
<input type="number" id="pink" value="0" min="0" onchange="hitung()">
</div>

<div class="product">
<img src="https://via.placeholder.com/60/000000/ffffff?text=Hitam">
<div class="product-info">
<div class="product-title">Tas Travel Hitam</div>
<div class="product-price">Rp50.000</div>
</div>
<input type="number" id="hitam" value="0" min="0" onchange="hitung()">
</div>

<select id="pembayaran">
<option value="">Metode Pembayaran</option>
<option value="Cash on Delivery">COD</option>
<option value="Transfer Bank">Transfer</option>
</select>

<input type="text" id="nama" placeholder="Nama Penerima">
<input type="text" id="jalan" placeholder="Nama Jalan">
<input type="number" id="rt" placeholder="RT">
<input type="number" id="rumah" placeholder="No Rumah">
<input type="text" id="kelurahan" placeholder="Kelurahan">
<input type="text" id="kecamatan" placeholder="Kecamatan">
<input type="text" id="kota" placeholder="Kota">
<input type="text" id="provinsi" placeholder="Provinsi">
<textarea id="catatan" placeholder="Catatan Rumah"></textarea>

<!-- SUMMARY -->
<div class="summary">

<div class="row">
<span>Subtotal</span>
<span id="subtotal">Rp0</span>
</div>

<div class="row">
<span>Diskon</span>
<span class="green" id="diskon">Rp0</span>
</div>

<div class="row">
<span>Ongkir</span>
<span><span class="strike">Rp25.000</span> Gratis</span>
</div>

<div class="row total">
<span>Total</span>
<span id="total">Rp0</span>
</div>

<div class="green" id="hemat"></div>

</div>

<button type="button" onclick="kirim()">Kirim Pesanan</button>

</form>

</div>
</div>

<script>

var harga=50000;

function hitung(){

var pink=parseInt(document.getElementById("pink").value)||0;
var hitam=parseInt(document.getElementById("hitam").value)||0;

var qty=pink+hitam;

var subtotal=qty*harga;
var diskon=(qty>1)?(qty-1)*5000:0;
var total=subtotal-diskon;

document.getElementById("subtotal").innerText="Rp"+subtotal.toLocaleString("id-ID");
document.getElementById("diskon").innerText="- Rp"+diskon.toLocaleString("id-ID");
document.getElementById("total").innerText="Rp"+total.toLocaleString("id-ID");

document.getElementById("hemat").innerText = diskon>0 ? "Kamu hemat Rp"+diskon.toLocaleString("id-ID") : "";

}

function kirim(){

var pink=parseInt(document.getElementById("pink").value)||0;
var hitam=parseInt(document.getElementById("hitam").value)||0;

if(pink==0 && hitam==0){
alert("Pilih produk dulu 😊");
return;
}

var pembayaran=document.getElementById("pembayaran").value;
if(pembayaran==""){
alert("Pilih pembayaran 😊");
return;
}

var nama=document.getElementById("nama").value;
var jalan=document.getElementById("jalan").value;
var rt=document.getElementById("rt").value;
var rumah=document.getElementById("rumah").value;
var kel=document.getElementById("kelurahan").value;
var kec=document.getElementById("kecamatan").value;
var kota=document.getElementById("kota").value;
var prov=document.getElementById("provinsi").value;
var catatan=document.getElementById("catatan").value;

if(nama==""||jalan==""||rt==""||rumah==""||kel==""||kec==""||kota==""||prov==""||catatan==""){
alert("Lengkapi alamat 😊");
return;
}

var qty=pink+hitam;
var subtotal=qty*harga;
var diskon=(qty>1)?(qty-1)*5000:0;
var total=subtotal-diskon;

var detail="";
if(pink>0){detail+="Tas Pink x "+pink+"%0A";}
if(hitam>0){detail+="Tas Hitam x "+hitam+"%0A";}

var pesan=
"Halo kak saya mau pesan%0A%0A"+
"*Nama:* "+nama+"%0A"+
"*Alamat:* "+jalan+" RT."+rt+" No."+rumah+"%0A"+catatan+"%0A"+kota+" "+prov+"%0A%0A"+
"*Pesanan:*%0A"+detail+
"%0ASubtotal: Rp"+subtotal.toLocaleString("id-ID")+
"%0ADiskon: Rp"+diskon.toLocaleString("id-ID")+
"%0AOngkir: Gratis"+
"%0A*Total: Rp"+total.toLocaleString("id-ID");

window.location.href="https://api.whatsapp.com/send?phone=15558770694&text="+pesan;
}

</script>

</body>
</html>
